name: Review Service CI/CD with SAST
# Latest update: Force workflow refresh with correct SonarCloud action

on:
  push:
    branches: [main]

jobs:
  sonar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@b4ffde65f69c9ce8cabaf6f0080e5d18d086f591
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@597ddf103f6b7f2a95dff5e1e0f29f8e4a5f0d7d
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONARCLOUD_TOKEN }}

  deploy:
    needs: sonar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@b4ffde65f69c9ce8cabaf6f0080e5d18d086f591

      - name: Login to Docker Hub
        uses: docker/login-action@9780b0c1fda696587d89d2f1512b5231225319f1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@0a97817b6ade9f46837855d676f2dfa89e1ee943
        with:
          context: ./review-service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/review-service:latest

      # UNCOMMENT AND CONFIGURE WHEN AWS DEPLOYMENT IS READY
