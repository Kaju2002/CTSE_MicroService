name: Booking Service CI/CD

on:
  push:
    branches: [main]
    paths:
      - "booking-service/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./booking-service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/booking-service:latest

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_BOOKING }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_BOOKING }}
          aws-region: eu-north-1

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster ctse-booking-cluster \
            --service booking-service \
            --force-new-deployment \
            --region eu-north-1
